services:
  rag:
    build:
      context: ./RAG
      dockerfile: Dockerfile
    container_name: notely-rag
    env_file:
      - ./RAG/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notely-web
    env_file:
      - ./.env.local
    environment:
      - FASTAPI_URL=http://rag:8000
    ports:
      - "3000:3000"
    depends_on:
      rag:
        condition: service_healthy
    restart: unless-stopped

